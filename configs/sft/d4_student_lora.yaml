# D4（DEVLOG S26）：蒸馏的学生模型（Qwen2.5-1.5B-Instruct / 3B-Instruct）。
# 与 E2a（e2_relevance_qlora_1ep_best.yaml）只差一点：不量化，bf16 LoRA（小模型显存足够，也避免部署时的量化差异，见 P8）。
# 训练数据由 DATASET_DIR 决定：gold = e1_relevance，教师标签 = d4_distill/{teacher20k,teacher50k}。
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset: esci_rel_train
eval_dataset: esci_rel_val
template: qwen
cutoff_len: 384
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: saves/d4
logging_steps: 10
plot_loss: true

per_device_train_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

per_device_eval_batch_size: 16
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
report_to: none
